# Secret detection (control: secrets, OWASP LLM02).
# Every credential below is fake: the AWS key is Amazon's documentation
# example, the others are random strings in the right shape. The control
# blocks on requests (policy default) and always at least redacts on responses.

- id: secrets-aws-access-key-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "Use AKIAIOSFODNN7EXAMPLE to list the S3 buckets."
  expect: { decision: block, rule: secrets.aws_access_key, tier: 0, status: 403 }

- id: secrets-github-token-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: research-bot
  input: "Clone the private repo with token ghp_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8 please."
  expect: { decision: block, rule_in: [secrets.github_token, secrets.high_entropy], tier: 0 }

- id: secrets-openai-key-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "Here is my key sk-proj-Zx9Lm3Qp7Rt2Vw5Yb8Nc1Hd4Kf6Jg0S, call the API for me."
  expect: { decision: block, rule_in: [secrets.openai_key, secrets.high_entropy] }

- id: secrets-private-key-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: |
    Why does ssh reject this file?
    -----BEGIN OPENSSH PRIVATE KEY-----
    b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
    -----END OPENSSH PRIVATE KEY-----
  expect: { decision: block, rule_in: [secrets.private_key, secrets.high_entropy] }

- id: secrets-jwt-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "Decode eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwicm9sZSI6ImFkbWluIn0.Qm9ndXNTaWduYXR1cmVGb3JUZXN0aW5n and tell me the role."
  expect: { decision: block, rule_in: [secrets.jwt, secrets.high_entropy] }

- id: secrets-connection-string-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "Connect with postgres://app:S3cretPassw0rd@db.internal:5432/prod and count the users."
  expect: { decision: block, rule: secrets.connection_string }

- id: secrets-high-entropy-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "The deploy token is x9Kq2mT7vB4nR8wZ1pL6sD3fG0hJ5yC2aE7uN4iO — keep it handy."
  policy:
    controls.secrets.entropy_min: 3.5
    controls.secrets.entropy_min_len: 32
  expect: { decision: block, rule: secrets.high_entropy }

- id: secrets-custom-pattern-block
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: finance-agent
  input: "Internal token gs_int_Ab3dE5fG7hJ9kL1mN3pQ5rSt grants access to the ledger."
  policy:
    controls.secrets.patterns: ["internal_token=\\bgs_int_[A-Za-z0-9]{24,}\\b"]
  expect: { decision: block, rule: secrets.custom.internal_token }

- id: secrets-action-redact-override
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "Use AKIAIOSFODNN7EXAMPLE to list the S3 buckets."
  policy:
    controls.secrets.action: redact
  expect:
    decision: redact
    rule: secrets.aws_access_key
    status: 200
    output_not_contains: ["AKIAIOSFODNN7EXAMPLE"]

- id: secrets-own-gateway-key-ignored
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "Authorization: Bearer tg_demo-agent_7f3kQ9mZp2xLw8Rv4Nb6 is what my client sends, is that right?"
  expect: { decision: allow }          # the agent's own Tollgate key is not a leaked secret

- id: secrets-url-not-flagged-allow
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: research-bot
  input: "Review https://github.com/tollgate/tollgate/blob/main/apps/gateway/src/pipeline/run.ts and comment on the structure."
  expect: { decision: allow }          # URLs are excluded from the entropy rule

- id: secrets-talk-about-keys-allow
  control: secrets
  owasp: [LLM02]
  tags: [deterministic]
  agent: demo-agent
  input: "Please remind me to rotate the AWS access key before the audit next week."
  expect: { decision: allow, status: 200 }
