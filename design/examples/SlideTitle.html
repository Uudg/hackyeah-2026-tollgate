<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><style>html,body{margin:0}
.tg-slide{grid-template-columns:1.15fr 1fr;column-gap:40px}
.tg-slide .top,.tg-slide .foot{grid-column:1/-1}
.tg-slide h1{align-self:center;font-size:64px;line-height:1.04;letter-spacing:-.03em}
.mas{align-self:center;justify-self:center;width:420px}.mas svg{width:100%;height:auto}
</style></head><body>
<section class="tg-slide">
<div class="top"><img class="tg-logo" src="../logo/logo.svg" alt="tollgate"><span>AI Control Layer</span></div>
<h1>One policy file between your agents <span class="m">and everything they can touch.</span></h1>
<div class="mas"><svg class="tg-canary is-idle" viewBox="-24 0 144 120" aria-label="Tollgate canary">
 <g class="arm"><rect x="34" y="79" width="80" height="10" rx="5" fill="var(--ink)"/><g fill="var(--panel)"><polygon points="58,79 64,79 60,89 54,89"/><polygon points="78,79 84,79 80,89 74,89"/><polygon points="98,79 104,79 100,89 94,89"/></g></g>
 <rect x="24" y="63" width="14" height="51" rx="4" fill="var(--ink)"/>
 <g class="bird">
  <polygon points="17,52 8,47 9,57" fill="var(--canary-shade)"/>
  <rect x="16" y="31" width="30" height="33" rx="10" fill="var(--canary)"/>
  <path d="M16 44 H28 A5 5 0 0 1 28 54 H16 Z" fill="var(--canary-shade)"/>
  <polygon points="46,41 53.5,44.5 46,48" fill="var(--canary-beak)"/>
  <circle class="e-open" cx="38.5" cy="41" r="2.4" fill="var(--ink)"/>
  <path class="e-happy" d="M35.9 42 q2.6 -3.4 5.2 0" stroke="var(--ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <g class="e-x" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"><line x1="36.3" y1="38.8" x2="40.7" y2="43.2"/><line x1="40.7" y1="38.8" x2="36.3" y2="43.2"/></g>
  <line class="brow" x1="34.5" y1="35.4" x2="42" y2="37.4" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
  <rect class="bar" x="29" y="37.5" width="17" height="7" fill="var(--ink)"/>
 </g>
</svg>
</div>
<div class="foot"><span>Dan Pankrashkin</span><span>HackYeah 2026 · Goldman Sachs track</span></div>
</section>
<script>const s=["idle","allow","idle","redact","idle","block"];let i=0;const svg=document.querySelector('.tg-canary');setInterval(()=>{i=(i+1)%s.length;svg.setAttribute('class','tg-canary is-'+s[i]);},1400);</script>
</body></html>
